<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云间州的空间 · 点赞好友一览</title>
    <meta name="description" content="QQ空间动态点赞好友列表">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #070b14;
            --bg-secondary: #0f1524;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.06);
            --card-hover-bg: rgba(255, 255, 255, 0.07);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --accent-teal: #14b8a6;
            --accent-green: #10b981;
            --gradient-1: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --gradient-2: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%);
            --gradient-3: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Canvas Particle Background */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Animated background */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.12;
            animation: float 25s ease-in-out infinite;
        }

        .bg-orb:nth-child(1) {
            width: 700px;
            height: 700px;
            background: #4f46e5;
            top: -10%;
            right: -10%;
            animation-delay: 0s;
        }

        .bg-orb:nth-child(2) {
            width: 600px;
            height: 600px;
            background: #ec4899;
            bottom: -15%;
            left: -10%;
            animation-delay: -8s;
        }

        .bg-orb:nth-child(3) {
            width: 500px;
            height: 500px;
            background: #06b6d4;
            top: 35%;
            left: 25%;
            animation-delay: -16s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -40px) scale(1.08); }
            66% { transform: translate(-30px, 30px) scale(0.92); }
        }

        /* Grid pattern overlay */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 24px 80px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border-radius: 100px;
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .header-badge svg {
            width: 15px;
            height: 15px;
        }

        .header h1 {
            font-size: clamp(30px, 5vw, 46px);
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 16px;
            color: var(--text-secondary);
            max-width: 540px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .stats-row {
            display: flex;
            justify-content: center;
            gap: 48px;
            margin-top: 36px;
        }

        .stat-item {
            text-align: center;
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 12px 28px;
            border-radius: 16px;
            min-width: 140px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .stat-value {
            font-size: 30px;
            font-weight: 700;
            background: var(--gradient-3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* Controls Panel */
        .controls-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 280px;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            pointer-events: none;
        }

        #searchInput {
            width: 100%;
            padding: 14px 44px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        #searchInput:focus {
            border-color: var(--accent-blue);
            background: rgba(0, 0, 0, 0.35);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.15);
        }

        #clearSearch {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            padding: 2px;
            line-height: 1;
        }

        #clearSearch:hover {
            color: var(--text-primary);
        }

        .sort-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sort-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .sort-buttons {
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .sort-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .sort-btn:hover {
            color: var(--text-primary);
        }

        .sort-btn.active {
            background: rgba(255, 255, 255, 0.08);
            color: #60a5fa;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 28px 24px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-1);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            background: var(--card-hover-bg);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.03);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card:nth-child(3n+1)::before { background: var(--gradient-1); }
        .card:nth-child(3n+2)::before { background: var(--gradient-2); }
        .card:nth-child(3n)::before { background: var(--gradient-3); }

        .card-top {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .avatar-wrap {
            position: relative;
            width: 52px;
            height: 52px;
            flex-shrink: 0;
        }

        .avatar-ring {
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            padding: 3px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .card:nth-child(3n+1) .avatar-ring { background: var(--gradient-1); }
        .card:nth-child(3n+2) .avatar-ring { background: var(--gradient-2); }
        .card:nth-child(3n) .avatar-ring { background: var(--gradient-3); }

        .card:hover .avatar-ring {
            opacity: 1;
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 1;
            background: var(--bg-secondary);
            border: 2px solid transparent;
        }

        .card:hover .avatar {
            border-color: var(--bg-primary);
        }

        .card-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-qq {
            font-size: 13px;
            color: var(--text-muted);
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .like-count {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .like-icon {
            width: 17px;
            height: 17px;
            color: var(--accent-pink);
        }

        .like-count strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .card-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .copy-card-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            transform: translateX(8px);
        }

        .card:hover .copy-card-btn {
            opacity: 1;
            transform: translateX(0);
        }

        .copy-card-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #60a5fa;
            border-color: rgba(96, 165, 250, 0.3);
        }

        .copy-card-btn svg {
            width: 14px;
            height: 14px;
        }

        .visit-hint {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0;
            transform: translateX(-8px);
            transition: all 0.3s ease;
        }

        .card:hover .visit-hint {
            opacity: 1;
            transform: translateX(0);
            color: #60a5fa;
        }

        .visit-hint svg {
            width: 14px;
            height: 14px;
        }

        /* Rank badges for top 3 */
        .rank-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }

        .rank-1 { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
        .rank-2 { background: linear-gradient(135deg, #94a3b8, #64748b); }
        .rank-3 { background: linear-gradient(135deg, #d97706, #b45309); }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 32px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .footer p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .footer a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 5, 10, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(15, 21, 36, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 40px 32px 32px;
            width: 90%;
            max-width: 420px;
            position: relative;
            transform: scale(0.9) translateY(20px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
        }

        .modal-overlay.show .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            line-height: 1;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }

        .modal-header {
            margin-bottom: 24px;
        }

        .modal-avatar-wrap {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 16px;
        }

        .modal-avatar-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            padding: 4px;
            background: var(--gradient-1);
        }

        .modal-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0f1524;
            position: relative;
            z-index: 1;
            background: var(--bg-secondary);
        }

        #modalName {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .modal-qq-container {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #modalQQ {
            font-size: 14px;
            color: var(--text-secondary);
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
        }

        .copy-btn-modal {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px;
            display: flex;
            align-items: center;
            transition: color 0.2s ease;
        }

        .copy-btn-modal:hover {
            color: #60a5fa;
        }

        .copy-btn-modal svg {
            width: 14px;
            height: 14px;
        }

        .modal-body {
            margin-bottom: 28px;
        }

        .modal-stat {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .modal-stat-value {
            font-size: 26px;
            font-weight: 700;
            color: var(--accent-pink);
        }

        .modal-stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .modal-qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .qr-container {
            position: relative;
            width: 140px;
            height: 140px;
            background: #fff;
            padding: 8px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        #modalQR {
            width: 100%;
            height: 100%;
            z-index: 2;
            position: relative;
        }

        .qr-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #5b6b8a;
            z-index: 1;
            background: #f0f4ff;
            border-radius: 12px;
        }

        .qr-tip {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .action-btn svg {
            width: 18px;
            height: 18px;
        }

        .primary-action {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .primary-action:hover {
            background: linear-gradient(135deg, #60a5fa 0%, #2563eb 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        .secondary-action {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }

        .secondary-action:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        /* Toast styles */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translate(-50%, 50px);
            background: rgba(16, 185, 129, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .toast.show {
            transform: translate(-50%, 0);
            opacity: 1;
        }

        /* Entry animation */
        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .controls-panel {
                flex-direction: column;
                align-items: stretch;
            }
            .sort-box {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .sort-buttons {
                width: 100%;
            }
            .sort-btn {
                flex: 1;
                text-align: center;
                padding: 8px 8px;
                font-size: 12px;
            }
        }

        @media (max-width: 640px) {
            .container { padding: 40px 16px 60px; }
            .cards-grid { grid-template-columns: 1fr; gap: 16px; }
            .stats-row { gap: 16px; flex-wrap: wrap; }
            .stat-item { flex: 1; min-width: 100px; padding: 10px 16px; }
            .stat-value { font-size: 24px; }
        }
    </style>
</head>
<body>
    <!-- Background elements -->
    <canvas id="particleCanvas"></canvas>
    <div class="bg-decoration">
        <div class="bg-orb"></div>
        <div class="bg-orb"></div>
        <div class="bg-orb"></div>
    </div>
    <div class="bg-grid"></div>

    <div class="container">
        <header class="header">
            <div class="header-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                QQ空间 · 点赞数据面板
            </div>
            <h1>云间州的空间互动</h1>
            <p>以下是所有在动态中点过赞的好友。点击好友卡片可发起临时会话、扫码或访问其QQ空间。</p>
            <div class="stats-row">
                <div class="stat-item">
                    <div class="stat-value" id="totalLikers">24</div>
                    <div class="stat-label">点赞好友</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalLikes">133</div>
                    <div class="stat-label">总点赞数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalFeeds">18</div>
                    <div class="stat-label">被赞动态</div>
                </div>
            </div>
        </header>

        <!-- Controls panel (Search & Sort) -->
        <div class="controls-panel">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="searchInput" placeholder="搜索好友昵称或 QQ 号...">
                <button id="clearSearch" style="display: none;">&times;</button>
            </div>
            <div class="sort-box">
                <span class="sort-label">排序方式</span>
                <div class="sort-buttons">
                    <button class="sort-btn active" data-sort="count-desc">点赞最多 🥇</button>
                    <button class="sort-btn" data-sort="count-asc">点赞最少 🥉</button>
                    <button class="sort-btn" data-sort="qq-asc">QQ号 🔢</button>
                </div>
            </div>
        </div>

        <div class="cards-grid" id="cardsGrid"></div>

        <footer class="footer">
            <p>数据提取自 <a href="http://user.qzone.qq.com/1154522335" target="_blank">云间州的QQ空间</a>（QQ: 1154522335）</p>
        </footer>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-card">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-header">
                <div class="modal-avatar-wrap">
                    <div class="modal-avatar-ring"></div>
                    <img id="modalAvatar" class="modal-avatar" src="" alt="用户头像"
                         onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iIzViNmI4YSI+PGNpcmNsZSBjeD0iMTIiIGN5PSI4IiByPSI0Ii8+PHBhdGggZD0iTTIwIDIxdi0yYTQgNCAwIDAgMC00LTRIOGE0IDQgMCAwIDAtNCA0djIiLz48L3N2Zz4='">
                </div>
                <h2 id="modalName">昵称</h2>
                <div class="modal-qq-container">
                    <span id="modalQQ">QQ: 0000000000</span>
                    <button class="copy-btn-modal" id="copyQQBtn" title="复制QQ号">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    </button>
                </div>
            </div>
            <div class="modal-body">
                <div class="modal-stat">
                    <div class="modal-stat-value" id="modalLikeCount">0</div>
                    <div class="modal-stat-label">点赞互动次数</div>
                </div>
                
                <div class="modal-qr-section">
                    <div class="qr-container">
                        <img id="modalQR" src="" alt="空间二维码" style="display: none;">
                        <div class="qr-placeholder">二维码加载中...</div>
                    </div>
                    <p class="qr-tip">手机 QQ 扫码即可直接访问其空间</p>
                </div>
            </div>
            <div class="modal-actions">
                <a id="modalSpaceLink" href="" target="_blank" class="action-btn primary-action">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    电脑网页访问
                </a>
                <a id="modalChatLink" href="" class="action-btn secondary-action">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    发起临时会话 / 加好友
                </a>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">复制成功！</div>

    <script>
        // Data List
        const likers = [
            { qq: "1993057220", name: "人穷事多", count: 16 },
            { qq: "3108817332", name: "Shine", count: 14 },
            { qq: "1154522335", name: "云间州", count: 13 },
            { qq: "1828274706", name: "陈旻洁", count: 12 },
            { qq: "3942263406", name: "小桃子", count: 10 },
            { qq: "2379142893", name: "Soro Gallenland", count: 10 },
            { qq: "3334940095", name: "MsnF.", count: 7 },
            { qq: "2195362612", name: "strawberry", count: 7 },
            { qq: "3996703048", name: "clover丶", count: 7 },
            { qq: "2291069811", name: "慟", count: 6 },
            { qq: "1259763651", name: "北豺豺豺豺", count: 5 },
            { qq: "3756374838", name: "聊一会", count: 3 },
            { qq: "3688015084", name: "淚", count: 3 },
            { qq: "3926275317", name: "北\uD835\uDCE8", count: 3 },
            { qq: "48258480", name: "樱儿毛毛/qq", count: 3 },
            { qq: "3796549766", name: "痕", count: 3 },
            { qq: "3828452833", name: "ℋ右京", count: 2 },
            { qq: "1733014653", name: "惹灯", count: 2 },
            { qq: "3674865464", name: "哇酷哇酷", count: 2 },
            { qq: "459028611", name: "嗯.", count: 1 },
            { qq: "1652723138", name: "雨中花", count: 1 },
            { qq: "3072887080", name: "wyf", count: 1 },
            { qq: "3644766849", name: "自傷無色", count: 1 },
            { qq: "17559857", name: "/tp深白", count: 1 }
        ];

        // Particle System
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        let mouse = { x: null, y: null, radius: 150 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.speedY = Math.random() * 0.4 - 0.2;
                this.color = Math.random() > 0.5 ? 'rgba(96, 165, 250, 0.25)' : 'rgba(168, 85, 247, 0.25)';
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Bounce boundaries
                if (this.x < 0 || this.x > canvas.width) this.speedX = -this.speedX;
                if (this.y < 0 || this.y > canvas.height) this.speedY = -this.speedY;

                // Mouse interaction
                if (mouse.x !== null && mouse.y !== null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        let forceDirectionX = dx / distance;
                        let forceDirectionY = dy / distance;
                        let maxDistance = mouse.radius;
                        let force = (maxDistance - distance) / maxDistance;
                        let directionX = forceDirectionX * force * 1.2;
                        let directionY = forceDirectionY * force * 1.2;
                        this.x -= directionX;
                        this.y -= directionY;
                    }
                }
            }
        }

        function initParticles() {
            particles = [];
            const numberOfParticles = Math.floor((canvas.width * canvas.height) / 16000);
            for (let i = 0; i < numberOfParticles; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
        window.addEventListener('resize', initParticles);


        // UI Interaction & Dynamic Rendering
        const grid = document.getElementById('cardsGrid');
        const searchInput = document.getElementById('searchInput');
        const clearSearch = document.getElementById('clearSearch');
        const sortButtons = document.querySelectorAll('.sort-btn');
        const toast = document.getElementById('toast');

        // Modal elements
        const modal = document.getElementById('detailModal');
        const modalAvatar = document.getElementById('modalAvatar');
        const modalName = document.getElementById('modalName');
        const modalQQ = document.getElementById('modalQQ');
        const modalLikeCount = document.getElementById('modalLikeCount');
        const modalQR = document.getElementById('modalQR');
        const modalSpaceLink = document.getElementById('modalSpaceLink');
        const modalChatLink = document.getElementById('modalChatLink');
        const modalClose = document.getElementById('modalClose');
        const copyQQBtn = document.getElementById('copyQQBtn');

        let activeSort = 'count-desc';
        let searchQuery = '';
        let currentModalQQ = '';
        let toastTimeout;

        // Render functions
        function renderCards() {
            grid.innerHTML = '';
            
            // 1. Filter
            const filtered = likers.filter(liker => {
                const query = searchQuery.trim().toLowerCase();
                if (!query) return true;
                return liker.name.toLowerCase().includes(query) || liker.qq.includes(query);
            });

            // 2. Sort
            filtered.sort((a, b) => {
                if (activeSort === 'count-desc') {
                    return b.count - a.count;
                } else if (activeSort === 'count-asc') {
                    return a.count - b.count;
                } else if (activeSort === 'qq-asc') {
                    return Number(a.qq) - Number(b.qq);
                }
                return 0;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="no-results" style="grid-column: 1/-1; text-align: center; padding: 60px 40px; color: var(--text-secondary);">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 48px; height: 48px; margin: 0 auto 16px; color: var(--text-muted);"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                        <p>没有找到符合条件的好友</p>
                    </div>
                `;
                return;
            }

            filtered.forEach((liker, index) => {
                // Find original index in likers array (pre-sorted descending) for absolute ranking
                const originalRank = likers.findIndex(l => l.qq === liker.qq);
                
                const card = document.createElement('a');
                card.className = 'card';
                card.href = `http://user.qzone.qq.com/${liker.qq}`;
                card.style.animationDelay = `${index * 0.03}s`;

                let rankBadge = '';
                if (originalRank === 0) rankBadge = '<div class="rank-badge rank-1">🥇</div>';
                else if (originalRank === 1) rankBadge = '<div class="rank-badge rank-2">🥈</div>';
                else if (originalRank === 2) rankBadge = '<div class="rank-badge rank-3">🥉</div>';

                const avatarUrl = `https://q1.qlogo.cn/g?b=qq&nk=${liker.qq}&s=100`;

                card.innerHTML = `
                    ${rankBadge}
                    <div class="card-top">
                        <div class="avatar-wrap">
                            <div class="avatar-ring"></div>
                            <img class="avatar" src="${avatarUrl}" alt="${liker.name}" 
                                 onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iIzViNmI4YSI+PGNpcmNsZSBjeD0iMTIiIGN5PSI4IiByPSI0Ii8+PHBhdGggZD0iTTIwIDIxdi0yYTQgNCAwIDAgMC00LTRIOGE0IDQgMCAwIDAtNCA0djIiLz48L3N2Zz4='">
                        </div>
                        <div>
                            <div class="card-name">${liker.name}</div>
                            <div class="card-qq">QQ ${liker.qq}</div>
                        </div>
                    </div>
                    <div class="card-bottom">
                        <div class="like-count">
                            <svg class="like-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                            点赞 <strong>${liker.count}</strong> 次
                        </div>
                        <div class="card-actions">
                            <button class="copy-card-btn" data-qq="${liker.qq}" title="复制QQ号">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                            </button>
                            <div class="visit-hint">
                                详情
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                            </div>
                        </div>
                    </div>
                `;

                // Event bindings for inner actions
                const copyBtn = card.querySelector('.copy-card-btn');
                copyBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    copyQQ(liker.qq);
                });

                card.addEventListener('click', (e) => {
                    e.preventDefault();
                    openModal(liker);
                });

                grid.appendChild(card);
            });
        }

        // Copy QQ helper
        function copyQQ(qq) {
            navigator.clipboard.writeText(qq).then(() => {
                showToast(`QQ号 ${qq} 已复制`);
            }).catch(err => {
                const textarea = document.createElement('textarea');
                textarea.value = qq;
                textarea.style.position = 'fixed';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast(`QQ号 ${qq} 已复制`);
                } catch (e) {
                    showToast('复制失败，请手动选择复制');
                }
                document.body.removeChild(textarea);
            });
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // Modal functionality
        function openModal(liker) {
            currentModalQQ = liker.qq;
            modalAvatar.src = `https://q1.qlogo.cn/g?b=qq&nk=${liker.qq}&s=100`;
            modalName.textContent = liker.name;
            modalQQ.textContent = `QQ: ${liker.qq}`;
            modalLikeCount.textContent = liker.count;
            
            modalSpaceLink.href = `http://user.qzone.qq.com/${liker.qq}`;
            modalChatLink.href = `tencent://message/?uin=${liker.qq}&Site=QQSpace&Menu=yes`;
            
            // Set QR code loading
            modalQR.style.display = 'none';
            const placeholder = modal.querySelector('.qr-placeholder');
            placeholder.textContent = '二维码加载中...';
            placeholder.style.display = 'flex';
            
            // QR code using public qrserver API
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent('http://user.qzone.qq.com/' + liker.qq)}`;
            modalQR.src = qrUrl;
            
            modalQR.onload = () => {
                placeholder.style.display = 'none';
                modalQR.style.display = 'block';
            };
            
            modalQR.onerror = () => {
                placeholder.textContent = '二维码加载失败';
            };

            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('show');
            document.body.style.overflow = '';
        }

        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        copyQQBtn.addEventListener('click', () => {
            if (currentModalQQ) copyQQ(currentModalQQ);
        });

        // Search & Sort Event Listeners
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            clearSearch.style.display = searchQuery.trim().length > 0 ? 'block' : 'none';
            renderCards();
        });

        clearSearch.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            clearSearch.style.display = 'none';
            searchInput.focus();
            renderCards();
        });

        sortButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                sortButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeSort = btn.getAttribute('data-sort');
                renderCards();
            });
        });

        // Initial Render
        renderCards();
    </script>
</body>
