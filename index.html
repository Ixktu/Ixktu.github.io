<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云间州的空间 · 点赞好友一览</title>
    <meta name="description" content="QQ空间动态点赞好友列表">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f7f6f3;
            --bg-secondary: #efede7;
            --card-bg: #ffffff;
            --card-border: #e6e3dd;
            --text-primary: #2d312e;
            --text-secondary: #606662;
            --text-muted: #8e9590;
            --accent-sage: #7d8c77;
            --accent-sage-light: #f0f3ef;
            --accent-sand: #d8c3a5;
            --accent-terracotta: #c48f7a;
            --accent-blue-nordic: #6d8294;
        }

        body {
            font-family: 'DM Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Shadowplay Background */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-blob {
            position: absolute;
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            filter: blur(80px);
            opacity: 0.22;
            mix-blend-mode: multiply;
            animation: organicFloat 28s ease-in-out infinite alternate;
        }

        .blob-1 {
            width: 500px;
            height: 500px;
            background: #e2ebdf;
            top: -8%;
            left: -10%;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 600px;
            height: 600px;
            background: #f3eae1;
            bottom: -10%;
            right: -8%;
            animation-delay: -8s;
        }

        .blob-3 {
            width: 450px;
            height: 450px;
            background: #e2eaf0;
            top: 35%;
            left: 45%;
            animation-delay: -16s;
        }

        @keyframes organicFloat {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            }
            50% {
                transform: translate(50px, -50px) scale(1.08) rotate(90deg);
                border-radius: 40% 60% 50% 50% / 50% 60% 40% 50%;
            }
            100% {
                transform: translate(-30px, 40px) scale(0.95) rotate(180deg);
                border-radius: 50% 50% 60% 40% / 60% 40% 60% 50%;
            }
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(247, 246, 243, 0.35) 100%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1120px;
            margin: 0 auto;
            padding: 45px 24px 60px;
        }

        /* Controls Panel */
        .controls-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px 24px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.01);
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 280px;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-muted);
            pointer-events: none;
        }

        #searchInput {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: #fafaf9;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.25s ease;
            outline: none;
        }

        #searchInput:focus {
            border-color: var(--accent-sage);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(125, 140, 119, 0.1);
        }

        #clearSearch {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            line-height: 1;
        }

        .sort-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sort-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .sort-buttons {
            display: flex;
            gap: 6px;
            background: #fafaf9;
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
        }

        .sort-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .sort-btn:hover {
            color: var(--text-primary);
        }

        .sort-btn.active {
            background: #ffffff;
            color: var(--accent-sage);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(125, 140, 119, 0.05);
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .card {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            text-decoration: none;
            color: inherit;
            display: block;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.005);
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-sage);
            box-shadow: 
                0 15px 30px rgba(45, 49, 46, 0.03),
                0 0 0 1px rgba(125, 140, 119, 0.08);
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .avatar-wrap {
            position: relative;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
        }

        .avatar-ring {
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            padding: 2px;
            background: var(--accent-sage);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .card:hover .avatar-ring {
            opacity: 0.6;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 1;
            background: var(--bg-primary);
            border: 2px solid #ffffff;
        }

        .card-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-qq {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'DM Sans', sans-serif;
            letter-spacing: 0.2px;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed #efede7;
            padding-top: 16px;
            margin-top: 16px;
        }

        .like-count {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .like-icon {
            width: 16px;
            height: 16px;
            color: var(--accent-terracotta);
        }

        .like-count strong {
            color: var(--text-primary);
            font-weight: 700;
        }

        .card-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .copy-card-btn {
            background: #fafaf9;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.25s ease;
            opacity: 0;
            transform: translateX(6px);
        }

        .card:hover .copy-card-btn {
            opacity: 1;
            transform: translateX(0);
        }

        .copy-card-btn:hover {
            background: var(--accent-sage-light);
            color: var(--accent-sage);
            border-color: rgba(125, 140, 119, 0.25);
        }

        .copy-card-btn svg {
            width: 12px;
            height: 12px;
        }

        .visit-hint {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0;
            transform: translateX(-6px);
            transition: all 0.25s ease;
            font-weight: 500;
        }

        .card:hover .visit-hint {
            opacity: 1;
            transform: translateX(0);
            color: var(--accent-sage);
        }

        .visit-hint svg {
            width: 12px;
            height: 12px;
        }

        /* Rank badges for top 3 */
        .rank-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .rank-1 { background: linear-gradient(135deg, #e5c185, #d2a45a); }
        .rank-2 { background: linear-gradient(135deg, #b8c3bc, #9fae9a); }
        .rank-3 { background: linear-gradient(135deg, #d3ad9c, #be8b75); }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(45, 49, 46, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #ffffff;
            border: 1px solid var(--card-border);
            box-shadow: 0 30px 60px rgba(45, 49, 46, 0.08), 0 0 0 1px rgba(0,0,0,0.01);
            border-radius: 20px;
            padding: 36px 28px 28px;
            width: 90%;
            max-width: 400px;
            position: relative;
            transform: scale(0.95) translateY(10px);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center;
        }

        .modal-overlay.show .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #fafaf9;
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            line-height: 1;
        }

        .modal-close:hover {
            background: var(--accent-sage-light);
            color: var(--accent-sage);
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-avatar-wrap {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 12px;
        }

        .modal-avatar-ring {
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            padding: 3px;
            background: var(--accent-sage);
            opacity: 0.6;
        }

        .modal-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffffff;
            position: relative;
            z-index: 1;
            background: var(--bg-primary);
        }

        #modalName {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .modal-qq-container {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #fafaf9;
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid var(--card-border);
        }

        #modalQQ {
            font-size: 13px;
            color: var(--text-secondary);
            font-family: 'DM Sans', sans-serif;
            letter-spacing: 0.2px;
        }

        .copy-btn-modal {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px;
            display: flex;
            align-items: center;
            transition: color 0.2s ease;
        }

        .copy-btn-modal:hover {
            color: var(--accent-sage);
        }

        .copy-btn-modal svg {
            width: 12px;
            height: 12px;
        }

        .modal-body {
            margin-bottom: 24px;
        }

        .modal-stat {
            background: #fafaf9;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .modal-stat-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent-sage);
            font-family: 'Playfair Display', serif;
        }

        .modal-stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
            font-weight: 500;
        }

        .modal-qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .qr-container {
            position: relative;
            width: 120px;
            height: 120px;
            background: #fff;
            padding: 6px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--card-border);
        }

        #modalQR {
            width: 100%;
            height: 100%;
            z-index: 2;
            position: relative;
        }

        .qr-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: var(--text-muted);
            z-index: 1;
            background: #fafaf9;
            border-radius: 10px;
        }

        .qr-tip {
            font-size: 11px;
            color: var(--text-muted);
        }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
            cursor: pointer;
            border: none;
        }

        .action-btn svg {
            width: 16px;
            height: 16px;
        }

        .primary-action {
            background: var(--accent-sage);
            color: #fff;
            box-shadow: 0 4px 12px rgba(125, 140, 119, 0.2);
        }

        .primary-action:hover {
            background: #6a7965;
            transform: translateY(-1.5px);
            box-shadow: 0 6px 16px rgba(125, 140, 119, 0.3);
        }

        .secondary-action {
            background: #ffffff;
            border: 1px solid var(--card-border);
            color: var(--text-primary);
        }

        .secondary-action:hover {
            background: #fafaf9;
            border-color: var(--accent-sage);
            color: var(--accent-sage);
            transform: translateY(-1.5px);
        }

        /* Toast styles */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translate(-50%, 50px);
            background: var(--accent-sage);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(125, 140, 119, 0.25);
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .toast.show {
            transform: translate(-50%, 0);
            opacity: 1;
        }

        /* Entry animation */
        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .controls-panel {
                flex-direction: column;
                align-items: stretch;
            }
            .sort-box {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .sort-buttons {
                width: 100%;
            }
            .sort-btn {
                flex: 1;
                text-align: center;
                padding: 6px 6px;
                font-size: 11px;
            }
        }

        @media (max-width: 640px) {
            .container { padding: 30px 16px 50px; }
            .cards-grid { grid-template-columns: 1fr; gap: 16px; }
        }
    </style>
</head>
<body>
    <!-- Background Light / Shadowplay blobs -->
    <div class="bg-decoration">
        <div class="bg-blob blob-1"></div>
        <div class="bg-blob blob-2"></div>
        <div class="bg-blob blob-3"></div>
    </div>
    <div class="bg-overlay"></div>

    <div class="container">
        <!-- Controls panel (Search & Sort) -->
        <div class="controls-panel">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="searchInput" placeholder="搜索好友昵称或 QQ 号...">
                <button id="clearSearch" style="display: none;">&times;</button>
            </div>
            <div class="sort-box">
                <span class="sort-label">排序方式</span>
                <div class="sort-buttons">
                    <button class="sort-btn active" data-sort="count-desc">点赞最多 🥇</button>
                    <button class="sort-btn" data-sort="count-asc">点赞最少 🥉</button>
                    <button class="sort-btn" data-sort="qq-asc">QQ号 🔢</button>
                </div>
            </div>
        </div>

        <div class="cards-grid" id="cardsGrid"></div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-card">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-header">
                <div class="modal-avatar-wrap">
                    <div class="modal-avatar-ring"></div>
                    <img id="modalAvatar" class="modal-avatar" src="" alt="用户头像"
                         onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iJobsNmI4YSI+PGNpcmNsZSBjeD0iMTIiIGN5PSI4IiByPSI0Ii8+PHBhdGggZD0iTTIwIDIxdi0yYTQgNCAwIDAgMC00LTRIOGE0IDQgMCAwIDAtNCA0djIiLz48L3N2Zz4='">
                </div>
                <h2 id="modalName">昵称</h2>
                <div class="modal-qq-container">
                    <span id="modalQQ">QQ: 0000000000</span>
                    <button class="copy-btn-modal" id="copyQQBtn" title="复制QQ号">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    </button>
                </div>
            </div>
            <div class="modal-body">
                <div class="modal-stat">
                    <div class="modal-stat-value" id="modalLikeCount">0</div>
                    <div class="modal-stat-label">点赞互动次数</div>
                </div>
                
                <div class="modal-qr-section">
                    <div class="qr-container">
                        <img id="modalQR" src="" alt="空间二维码" style="display: none;">
                        <div class="qr-placeholder">二维码加载中...</div>
                    </div>
                    <p class="qr-tip">手机 QQ 扫码即可直接访问其空间</p>
                </div>
            </div>
            <div class="modal-actions">
                <a id="modalSpaceLink" href="" target="_blank" class="action-btn primary-action">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    电脑网页访问
                </a>
                <a id="modalChatLink" href="" class="action-btn secondary-action">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    发起临时会话 / 加好友
                </a>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">复制成功！</div>

    <script>
        // Default Embedded Data List (Fallback if likers.json fails/missing)
        const defaultLikers = [
            { qq: "1993057220", name: "人穷事多", count: 16 },
            { qq: "3108817332", name: "Shine", count: 14 },
            { qq: "1154522335", name: "云间州", count: 13 },
            { qq: "1828274706", name: "陈旻洁", count: 12 },
            { qq: "3942263406", name: "小桃子", count: 10 },
            { qq: "2379142893", name: "Soro Gallenland", count: 10 },
            { qq: "3334940095", name: "MsnF.", count: 7 },
            { qq: "2195362612", name: "strawberry", count: 7 },
            { qq: "3996703048", name: "clover丶", count: 7 },
            { qq: "2291069811", name: "慟", count: 6 },
            { qq: "1259763651", name: "北豺豺豺豺", count: 5 },
            { qq: "3756374838", name: "聊一会", count: 3 },
            { qq: "3688015084", name: "淚", count: 3 },
            { qq: "3926275317", name: "北\uD835\uDCE8", count: 3 },
            { qq: "48258480", name: "樱儿毛毛/qq", count: 3 },
            { qq: "3796549766", name: "痕", count: 3 },
            { qq: "3828452833", name: "ℋ右京", count: 2 },
            { qq: "1733014653", name: "惹灯", count: 2 },
            { qq: "3674865464", name: "哇酷哇酷", count: 2 },
            { qq: "459028611", name: "嗯.", count: 1 },
            { qq: "1652723138", name: "雨中花", count: 1 },
            { qq: "3072887080", name: "wyf", count: 1 },
            { qq: "3644766849", name: "自傷無色", count: 1 },
            { qq: "17559857", name: "/tp深白", count: 1 }
        ];

        // Current active dataset
        let likers = [...defaultLikers];

        // UI Interaction & Dynamic Rendering
        const grid = document.getElementById('cardsGrid');
        const searchInput = document.getElementById('searchInput');
        const clearSearch = document.getElementById('clearSearch');
        const sortButtons = document.querySelectorAll('.sort-btn');
        const toast = document.getElementById('toast');

        // Modal elements
        const modal = document.getElementById('detailModal');
        const modalAvatar = document.getElementById('modalAvatar');
        const modalName = document.getElementById('modalName');
        const modalQQ = document.getElementById('modalQQ');
        const modalLikeCount = document.getElementById('modalLikeCount');
        const modalQR = document.getElementById('modalQR');
        const modalSpaceLink = document.getElementById('modalSpaceLink');
        const modalChatLink = document.getElementById('modalChatLink');
        const modalClose = document.getElementById('modalClose');
        const copyQQBtn = document.getElementById('copyQQBtn');

        let activeSort = 'count-desc';
        let searchQuery = '';
        let currentModalQQ = '';
        let toastTimeout;

        // Render functions
        function renderCards() {
            grid.innerHTML = '';
            
            // 1. Filter
            const filtered = likers.filter(liker => {
                const query = searchQuery.trim().toLowerCase();
                if (!query) return true;
                return liker.name.toLowerCase().includes(query) || liker.qq.includes(query);
            });

            // 2. Sort
            filtered.sort((a, b) => {
                if (activeSort === 'count-desc') {
                    return b.count - a.count;
                } else if (activeSort === 'count-asc') {
                    return a.count - b.count;
                } else if (activeSort === 'qq-asc') {
                    return Number(a.qq) - Number(b.qq);
                }
                return 0;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="no-results" style="grid-column: 1/-1; text-align: center; padding: 60px 40px; color: var(--text-secondary);">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width: 48px; height: 48px; margin: 0 auto 16px; color: var(--text-muted);"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                        <p>没有找到符合条件的好友</p>
                    </div>
                `;
                return;
            }

            filtered.forEach((liker, index) => {
                // Find original index in likers array (pre-sorted descending) for absolute ranking
                const originalRank = likers.findIndex(l => l.qq === liker.qq);
                
                const card = document.createElement('a');
                card.className = 'card';
                card.href = `http://user.qzone.qq.com/${liker.qq}`;
                card.style.animationDelay = `${index * 0.02}s`;

                let rankBadge = '';
                if (originalRank === 0) rankBadge = '<div class="rank-badge rank-1">🥇</div>';
                else if (originalRank === 1) rankBadge = '<div class="rank-badge rank-2">🥈</div>';
                else if (originalRank === 2) rankBadge = '<div class="rank-badge rank-3">🥉</div>';

                const avatarUrl = `https://q1.qlogo.cn/g?b=qq&nk=${liker.qq}&s=100`;

                card.innerHTML = `
                    ${rankBadge}
                    <div class="card-top">
                        <div class="avatar-wrap">
                            <div class="avatar-ring"></div>
                            <img class="avatar" src="${avatarUrl}" alt="${liker.name}" 
                                 onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iJobsNmI4YSI+PGNpcmNsZSBjeD0iMTIiIGN5PSI4IiByPSI0Ii8+PHBhdGggZD0iTTIwIDIxdi0yYTQgNCAwIDAgMC00LTRIOGE0IDQgMCAwIDAtNCA0djIiLz48L3N2Zz4='">
                        </div>
                        <div>
                            <div class="card-name">${liker.name}</div>
                            <div class="card-qq">QQ ${liker.qq}</div>
                        </div>
                    </div>
                    <div class="card-bottom">
                        <div class="like-count">
                            <svg class="like-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                            点赞 <strong>${liker.count}</strong> 次
                        </div>
                        <div class="card-actions">
                            <button class="copy-card-btn" data-qq="${liker.qq}" title="复制QQ号">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                            </button>
                            <div class="visit-hint">
                                详情
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                            </div>
                        </div>
                    </div>
                `;

                // Event bindings for inner actions
                const copyBtn = card.querySelector('.copy-card-btn');
                copyBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    copyQQ(liker.qq);
                });

                card.addEventListener('click', (e) => {
                    e.preventDefault();
                    openModal(liker);
                });

                grid.appendChild(card);
            });
        }

        // Copy QQ helper
        function copyQQ(qq) {
            navigator.clipboard.writeText(qq).then(() => {
                showToast(`QQ号 ${qq} 已复制`);
            }).catch(err => {
                const textarea = document.createElement('textarea');
                textarea.value = qq;
                textarea.style.position = 'fixed';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast(`QQ号 ${qq} 已复制`);
                } catch (e) {
                    showToast('复制失败，请手动选择复制');
                }
                document.body.removeChild(textarea);
            });
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // Modal functionality
        function openModal(liker) {
            currentModalQQ = liker.qq;
            modalAvatar.src = `https://q1.qlogo.cn/g?b=qq&nk=${liker.qq}&s=100`;
            modalName.textContent = liker.name;
            modalQQ.textContent = `QQ: ${liker.qq}`;
            modalLikeCount.textContent = liker.count;
            
            modalSpaceLink.href = `http://user.qzone.qq.com/${liker.qq}`;
            modalChatLink.href = `tencent://message/?uin=${liker.qq}&Site=QQSpace&Menu=yes`;
            
            // Set QR code loading
            modalQR.style.display = 'none';
            const placeholder = modal.querySelector('.qr-placeholder');
            placeholder.textContent = '二维码加载中...';
            placeholder.style.display = 'flex';
            
            // QR code using public qrserver API
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent('http://user.qzone.qq.com/' + liker.qq)}`;
            modalQR.src = qrUrl;
            
            modalQR.onload = () => {
                placeholder.style.display = 'none';
                modalQR.style.display = 'block';
            };
            
            modalQR.onerror = () => {
                placeholder.textContent = '二维码加载失败';
            };

            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('show');
            document.body.style.overflow = '';
        }

        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        copyQQBtn.addEventListener('click', () => {
            if (currentModalQQ) copyQQ(currentModalQQ);
        });

        // Search & Sort Event Listeners
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            clearSearch.style.display = searchQuery.trim().length > 0 ? 'block' : 'none';
            renderCards();
        });

        clearSearch.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            clearSearch.style.display = 'none';
            searchInput.focus();
            renderCards();
        });

        sortButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                sortButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeSort = btn.getAttribute('data-sort');
                renderCards();
            });
        });

        // Dynamic Loading from likers.json
        fetch('./likers.json')
            .then(res => {
                if (!res.ok) throw new Error('File not found or server error');
                return res.json();
            })
            .then(data => {
                if (Array.isArray(data) && data.length > 0) {
                    likers = data.map(item => ({
                        qq: item.qq,
                        name: item.name,
                        count: item.count
                    }));
                    renderCards();
                }
            })
            .catch(err => {
                console.warn('Unable to load likers.json dynamically (Local CORS policy or file missing). Using embedded fallback data.', err);
                // Initial render with default embedded data
                renderCards();
            });
    </script>
</body>
</html>
